  output-dir: docs
  render:
    - "*.qmd"
    - "posts/*.qmd"

# The appearance lives here. Usually leave this line alone.
metadata-files:
  - _design/defaults.yml

website:
  title: "Johnny Amato"
  description: "A website about all things Johnny"
  # Later, when published, uncomment and replace the address below.
  site-url: "https://triplekgandthebigshow.github.io/quarto-academic-website-template/"
  navbar:
    left:
      - text: Home
        href: index.qmd
      - text: Projects
        href: research.qmd
      - text: Career
        href: career.qmd
      - text: Travel
        href: travel.qmd
      - text: Blog
        href: blog.qmd
